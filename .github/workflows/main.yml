name: CI - JMeter Non-GUI Load Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: [self-hosted, my-jmeter-vm]

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Install Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Download and install JMeter
      - name: Download & Install JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      # Create report directory
      - name: Create Reports Directory
        run: |
          rm -rf reports/html
          mkdir -p reports/html

      # Run JMeter locally on the GitHub Actions VM
      - name: Run JMeter in Non-GUI Mode
        run: |
          export JVM_ARGS="-Xms8g -Xmx8g"

          jmeter -n \
            -t "./1petstore.octoperf.har.jmx" \
            -l "result.jtl" \
            -e \
            -o "./reports/html" \
            -Jhost="api.staging.com" \
            -Jusers=10000

      # Upload HTML dashboard
      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: reports/html/

      # Upload raw JTL results
      - name: Upload Raw JTL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-raw-jtl
          path: result.jtl

