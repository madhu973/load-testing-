name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: PerfAction for JMeter
        uses: QAInsights/PerfAction@v3.0
        with:
          test-plan-path: 1petstore.octoperf.har.jmx   # Path to your .jmx file
          args: "-Jhost=api.staging.com -Jusers=10"   # Override JMeter variables
          
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/
