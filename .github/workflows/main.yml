name: CI - JMeter Non-GUI Load Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download & Install JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          echo "$GITHUB_WORKSPACE/apache-jmeter-5.6.3/bin" >> $GITHUB_PATH

      - name: Create Reports Directory
        run: mkdir -p reports/html

      - name: Run JMeter in Non-GUI Mode
        run: |
          jmeter -n \
            -t './1petstore.octoperf.har.jmx' \
            -l result.jtl \
            -e -o ./reports/html \
            -Jhost=api.staging.com \
            -Jusers=10

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-html-report
          path: reports/html/

      - name: Upload Raw JTL File
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jmeter-raw-jtl
          path: result.jtl
